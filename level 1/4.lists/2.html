<!DOCTYPE html>
<html>
    <head>
        <title>programming language => order list</title>
    </head>
    <body>
        <h2>programming languages</h2>
        <ol>
            <li>python</li>
            <li>c++</li>
            <li>javascript</li>
            <li>kotlin</li>
            <li>react</li>
        </ol>
    </body>
</html>

<!-- ul → unordered list (• bullet points)

ol → ordered list (1, 2, 3 numbering)

li → list item -->
