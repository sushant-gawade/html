<!DOCTYPE html>
<html>
<head>
    <title>Favorite Movies => unorder list</title>
</head>
<body>

    <h2>My Favorite Movies</h2>
    <ul>
        <li>Interstellar</li>
        <li>Inception</li>
        <li>KGF</li>
        <li>Bahubali</li>
        <li>3 Idiots</li>
    </ul>
    
<!-- ul = unordered list (bullet points)
li = list item (सूची का एक आइटम) -->

</body>
</html>
