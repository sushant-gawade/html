<!DOCTYPE html>
<html>
    <head>
        <title>3 into 3 table</title>
    </head>
    <body>
        <h2>3 row and 3 columns table</h2>
        <table border="1">
            <tr>
                <td>row 1, col 1</td>
                <td>row 1, col 2</td>
                <td>row 1, col 3</td>
            </tr>
            <tr>
                <td>row 2, col 1</td>
                <td>row 2, col 2</td>
                <td>row 2, col 3</td>
            </tr>
             <tr>
                <td>row 3, col 1</td>
                <td>row 3, col 2</td>
                <td>row 2, col 3</td>
            </tr>
        </table>
    </body>
</html>
