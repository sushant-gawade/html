<!DOCTYPE html>
<html>
<head>
    <title>Table with Header Row</title>
</head>
<body>

    <h2>Table with Header</h2>

    <table border="1">
        <tr>
            <th>Name</th><!--heading-->
            <th>Age</th>
            <th>City</th>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>22</td>
            <td>Mumbai</td>
        </tr>

        <tr>
            <td>Sneha</td>
            <td>20</td>
            <td>Pune</td>
        </tr>
    </table>

</body>
</html>
